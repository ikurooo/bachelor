apiVersion: v1
kind: Pod
metadata:
  name: wasm-app
  labels:
    app: benchmark-app
  annotations:
    module.wasm.image/variant: compat-smart
spec:
  runtimeClassName: wasmtime-cwasm
  containers:
    - name: app
      image: my-wasm-app:cwasm
      imagePullPolicy: Never
      command: ["/app.cwasm"]