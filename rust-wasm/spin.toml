#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "rust-wasm"
version = "0.1.0"
authors = ["ivan"]
description = ""

[[trigger.http]]
route = "/..."
component = "rust-wasm"

[component.rust-wasm]
source = "target/wasm32-wasip2/release/rust-wasm.wasm"
allowed_outbound_hosts = []
[component.rust-wasm.build]
command = "cargo build --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
